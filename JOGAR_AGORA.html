<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vida de Formiga</title>
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #07100a;
        color: #f4ffe8;
        font-family: Arial, Helvetica, sans-serif;
      }

      canvas {
        display: block;
        width: 100vw;
        height: 100vh;
        background: #0b1309;
      }

      .hud {
        position: fixed;
        top: 16px;
        left: 16px;
        right: 16px;
        z-index: 3;
        display: grid;
        grid-template-columns: 240px 120px 1fr;
        gap: 10px;
        pointer-events: none;
      }

      .panel {
        min-height: 58px;
        padding: 11px 13px;
        border: 1px solid rgba(230, 255, 210, 0.2);
        border-radius: 8px;
        background: rgba(5, 12, 8, 0.72);
        box-shadow: 0 16px 40px rgba(0, 0, 0, 0.3);
      }

      .panel span {
        display: block;
        margin-bottom: 7px;
        color: rgba(232, 249, 222, 0.72);
        font-size: 12px;
        font-weight: 700;
        text-transform: uppercase;
      }

      .panel strong {
        font-size: 17px;
      }

      .life-track {
        height: 12px;
        overflow: hidden;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.14);
      }

      .life-fill {
        height: 100%;
        width: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, #e64b42, #e7d76a, #70d76b);
      }

      .overlay {
        position: fixed;
        inset: 0;
        z-index: 5;
        display: grid;
        place-items: center;
        padding: 24px;
        text-align: center;
        background:
          radial-gradient(circle at 52% 42%, rgba(255, 236, 156, 0.16), transparent 28%),
          radial-gradient(circle at center, rgba(170, 225, 93, 0.12), transparent 34%),
          linear-gradient(rgba(4, 10, 7, 0.2), rgba(4, 10, 7, 0.82));
      }

      .overlay.hidden {
        display: none;
      }

      h1,
      h2 {
        margin: 0;
        color: #fbfff4;
        font-size: clamp(48px, 8vw, 104px);
        line-height: 0.95;
      }

      .overlay p {
        max-width: 620px;
        margin: 18px auto 0;
        color: rgba(244, 255, 232, 0.84);
        font-size: 18px;
        line-height: 1.55;
      }

      button {
        min-width: 180px;
        min-height: 48px;
        margin-top: 28px;
        border: 1px solid rgba(245, 255, 227, 0.32);
        border-radius: 8px;
        color: #11170d;
        background: #d8f27f;
        cursor: pointer;
        font: inherit;
        font-weight: 800;
      }

      button:hover {
        background: #edf7a6;
      }

      @media (max-width: 720px) {
        .hud {
          grid-template-columns: 1fr 110px;
          top: 10px;
          left: 10px;
          right: 10px;
        }

        .objective {
          grid-column: 1 / -1;
        }
      }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>

    <aside class="hud">
      <div class="panel">
        <span>Vida</span>
        <div class="life-track"><div id="lifeFill" class="life-fill"></div></div>
      </div>
      <div class="panel">
        <span>Comida</span>
        <strong id="foodText">0/5</strong>
      </div>
      <div class="panel objective">
        <span>Objetivo</span>
        <strong id="objectiveText">Colete 5 migalhas e evite a aranha</strong>
      </div>
    </aside>

    <section id="start" class="overlay">
      <div>
        <h1>Vida de Formiga</h1>
        <p>
          Caminhe pela grama alta de um quintal gigante, colete migalhas e fuja
          da aranha. Use WASD ou as setas.
        </p>
        <button id="startButton">Iniciar jogo</button>
      </div>
    </section>

    <section id="gameOver" class="overlay hidden">
      <div>
        <h2>Game Over</h2>
        <p id="gameOverText">A aranha alcançou a formiga.</p>
        <button id="restartButton">Reiniciar</button>
      </div>
    </section>

    <script>
      const canvas = document.getElementById("game");
      const ctx = canvas.getContext("2d");
      const start = document.getElementById("start");
      const gameOver = document.getElementById("gameOver");
      const lifeFill = document.getElementById("lifeFill");
      const foodText = document.getElementById("foodText");
      const objectiveText = document.getElementById("objectiveText");
      const gameOverText = document.getElementById("gameOverText");

      const keys = new Set();
      let running = false;
      let lastTime = performance.now();
      let camera = { x: 0, y: 0 };

      const ant = { x: 0, y: 0, angle: -Math.PI / 2, speed: 0, life: 100 };
      const spider = { x: 520, y: -420, angle: 0 };
      const home = { x: 0, y: 620 };
      let foods = [];
      let grass = [];
      let tallGrass = [];
      let stones = [];
      let leaves = [];
      let droplets = [];
      let dirt = [];
      let foodCount = 0;
      let legTime = 0;

      function resize() {
        canvas.width = window.innerWidth * devicePixelRatio;
        canvas.height = window.innerHeight * devicePixelRatio;
        ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
      }

      function resetWorld() {
        ant.x = 0;
        ant.y = 0;
        ant.angle = -Math.PI / 2;
        ant.speed = 0;
        ant.life = 100;
        spider.x = 520;
        spider.y = -420;
        foodCount = 0;
        foods = [
          { x: -260, y: -360, got: false },
          { x: 260, y: -300, got: false },
          { x: 460, y: 90, got: false },
          { x: -440, y: 230, got: false },
          { x: 80, y: 430, got: false },
        ];
        grass = Array.from({ length: 760 }, () => ({
          x: Math.random() * 1800 - 900,
          y: Math.random() * 1600 - 800,
          h: 34 + Math.random() * 78,
          shade: 80 + Math.random() * 80,
          sway: Math.random() * Math.PI * 2,
        }));
        tallGrass = Array.from({ length: 170 }, () => ({
          x: Math.random() * 1900 - 950,
          y: Math.random() * 1700 - 850,
          h: 100 + Math.random() * 170,
          w: 4 + Math.random() * 7,
          shade: 95 + Math.random() * 82,
          sway: Math.random() * Math.PI * 2,
        }));
        stones = [
          { x: -520, y: -470, r: 52 },
          { x: 390, y: 360, r: 70 },
          { x: -210, y: 500, r: 40 },
          { x: 610, y: -120, r: 36 },
        ];
        leaves = [
          { x: -360, y: -180, w: 190, h: 72, a: -0.35, c: "#8b662f" },
          { x: 330, y: 210, w: 220, h: 84, a: 0.55, c: "#7d8a39" },
          { x: -620, y: 260, w: 160, h: 58, a: 0.22, c: "#9d7134" },
        ];
        droplets = [
          { x: 230, y: -120, r: 26 },
          { x: -120, y: 300, r: 20 },
          { x: 575, y: -345, r: 18 },
        ];
        dirt = Array.from({ length: 360 }, () => ({
          x: Math.random() * 1900 - 950,
          y: Math.random() * 1700 - 850,
          r: 1 + Math.random() * 5,
          o: 0.08 + Math.random() * 0.18,
        }));
        updateHud();
      }

      function worldToScreen(x, y) {
        const depth = 1 / (1 + Math.max(-460, y - camera.y) * 0.0009);
        return {
          x: window.innerWidth / 2 + (x - camera.x) * depth,
          y: window.innerHeight / 2 + (y - camera.y) * 0.72 * depth,
          scale: depth,
        };
      }

      function drawGround(time) {
        const sky = ctx.createLinearGradient(0, 0, 0, window.innerHeight);
        sky.addColorStop(0, "#b8d8e8");
        sky.addColorStop(0.32, "#5f8b50");
        sky.addColorStop(0.65, "#253918");
        sky.addColorStop(1, "#0b1208");
        ctx.fillStyle = sky;
        ctx.fillRect(0, 0, window.innerWidth, window.innerHeight);

        const sun = ctx.createRadialGradient(window.innerWidth * 0.72, window.innerHeight * 0.1, 10, window.innerWidth * 0.72, window.innerHeight * 0.1, window.innerWidth * 0.62);
        sun.addColorStop(0, "rgba(255, 239, 167, 0.34)");
        sun.addColorStop(0.2, "rgba(255, 224, 122, 0.12)");
        sun.addColorStop(1, "rgba(255, 224, 122, 0)");
        ctx.fillStyle = sun;
        ctx.fillRect(0, 0, window.innerWidth, window.innerHeight);

        const soil = ctx.createLinearGradient(0, window.innerHeight * 0.42, 0, window.innerHeight);
        soil.addColorStop(0, "rgba(44, 64, 29, 0.58)");
        soil.addColorStop(1, "rgba(38, 25, 14, 0.55)");
        ctx.fillStyle = soil;
        ctx.fillRect(0, window.innerHeight * 0.42, window.innerWidth, window.innerHeight);

        for (const speck of dirt) {
          const p = worldToScreen(speck.x, speck.y);
          if (p.x < -10 || p.x > window.innerWidth + 10 || p.y < -10 || p.y > window.innerHeight + 10) continue;
          ctx.fillStyle = `rgba(73, 48, 28, ${speck.o})`;
          ctx.beginPath();
          ctx.arc(p.x, p.y + 22 * p.scale, speck.r * p.scale, 0, Math.PI * 2);
          ctx.fill();
        }

        for (const blade of grass) {
          const p = worldToScreen(blade.x, blade.y);
          if (p.x < -60 || p.x > window.innerWidth + 60 || p.y < -100 || p.y > window.innerHeight + 120) continue;
          const sway = Math.sin(time * 0.0017 + blade.sway) * 9;
          ctx.strokeStyle = `rgb(${Math.floor(blade.shade * 0.45)}, ${Math.floor(blade.shade)}, ${Math.floor(38 + blade.shade * 0.1)})`;
          ctx.lineWidth = Math.max(1, 2.2 * p.scale);
          ctx.beginPath();
          ctx.moveTo(p.x, p.y + 18 * p.scale);
          ctx.quadraticCurveTo(p.x + sway * p.scale, p.y - blade.h * 0.35 * p.scale, p.x + sway * 1.4 * p.scale, p.y - blade.h * p.scale);
          ctx.stroke();
        }
      }

      function drawLeaf(leaf) {
        const p = worldToScreen(leaf.x, leaf.y);
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(leaf.a);
        ctx.scale(p.scale, p.scale);
        ctx.fillStyle = leaf.c;
        ctx.strokeStyle = "rgba(42, 37, 17, 0.45)";
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.ellipse(0, 0, leaf.w / 2, leaf.h / 2, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
        ctx.strokeStyle = "rgba(38, 50, 20, 0.42)";
        ctx.beginPath();
        ctx.moveTo(-leaf.w * 0.42, 0);
        ctx.lineTo(leaf.w * 0.42, 0);
        ctx.stroke();
        ctx.restore();
      }

      function drawDrop(drop, time) {
        const p = worldToScreen(drop.x, drop.y);
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.scale(p.scale, p.scale * 0.72);
        const r = drop.r + Math.sin(time * 0.002 + drop.x) * 1.5;
        const water = ctx.createRadialGradient(-r * 0.35, -r * 0.35, 2, 0, 0, r * 1.2);
        water.addColorStop(0, "rgba(255,255,255,0.8)");
        water.addColorStop(0.35, "rgba(141,205,230,0.5)");
        water.addColorStop(1, "rgba(40,83,93,0.28)");
        ctx.fillStyle = water;
        ctx.beginPath();
        ctx.arc(0, 0, r, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      function drawRealisticAnt(x, y, angle) {
        const p = worldToScreen(x, y);
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.scale(p.scale, p.scale * 0.85);
        ctx.rotate(angle);

        ctx.fillStyle = "rgba(0,0,0,0.34)";
        ctx.beginPath();
        ctx.ellipse(-4, 20, 70, 16, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = "#110b07";
        ctx.lineWidth = 4;
        for (let i = 0; i < 3; i++) {
          const lx = -18 + i * 18;
          const walk = Math.sin(legTime * 12 + i) * 11;
          ctx.beginPath();
          ctx.moveTo(lx, -10);
          ctx.lineTo(lx - 22, -26 - walk);
          ctx.lineTo(lx - 38, -38 - walk * 0.3);
          ctx.stroke();
          ctx.beginPath();
          ctx.moveTo(lx, 10);
          ctx.lineTo(lx - 22, 26 + walk);
          ctx.lineTo(lx - 38, 38 + walk * 0.3);
          ctx.stroke();
        }

        const body = ctx.createLinearGradient(-52, -20, 48, 18);
        body.addColorStop(0, "#170c07");
        body.addColorStop(0.45, "#35170b");
        body.addColorStop(1, "#100805");
        for (const part of [
          { x: 28, y: 0, rx: 19, ry: 14 },
          { x: 0, y: 0, rx: 25, ry: 17 },
          { x: -34, y: 0, rx: 31, ry: 20 },
        ]) {
          ctx.fillStyle = body;
          ctx.beginPath();
          ctx.ellipse(part.x, part.y, part.rx, part.ry, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = "rgba(255, 209, 150, 0.12)";
          ctx.beginPath();
          ctx.ellipse(part.x + 5, part.y - 6, part.rx * 0.48, part.ry * 0.22, -0.4, 0, Math.PI * 2);
          ctx.fill();
        }

        ctx.strokeStyle = "#130906";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(43, -7);
        ctx.quadraticCurveTo(66, -30, 80, -18);
        ctx.moveTo(43, 7);
        ctx.quadraticCurveTo(66, 30, 80, 18);
        ctx.stroke();
        ctx.restore();
      }

      function drawSpider() {
        const p = worldToScreen(spider.x, spider.y);
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.scale(p.scale, p.scale * 0.86);
        ctx.rotate(spider.angle);

        ctx.fillStyle = "rgba(0,0,0,0.42)";
        ctx.beginPath();
        ctx.ellipse(-4, 22, 82, 22, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = "#17100f";
        ctx.lineWidth = 6;
        for (let i = 0; i < 4; i++) {
          const lx = -34 + i * 24;
          const walk = Math.sin(legTime * 8 + i) * 12;
          ctx.beginPath();
          ctx.moveTo(lx, -16);
          ctx.lineTo(lx - 34, -44 - walk);
          ctx.lineTo(lx - 68, -58 + walk);
          ctx.stroke();
          ctx.beginPath();
          ctx.moveTo(lx, 16);
          ctx.lineTo(lx - 34, 44 + walk);
          ctx.lineTo(lx - 68, 58 - walk);
          ctx.stroke();
        }

        const spiderBody = ctx.createRadialGradient(-12, -10, 4, 0, 0, 62);
        spiderBody.addColorStop(0, "#4b2b2c");
        spiderBody.addColorStop(1, "#171010");
        ctx.fillStyle = spiderBody;
        ctx.beginPath();
        ctx.ellipse(12, 0, 38, 28, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.ellipse(-36, 0, 29, 23, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "#dc4d38";
        ctx.beginPath();
        ctx.arc(-57, -8, 5, 0, Math.PI * 2);
        ctx.arc(-57, 8, 5, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      function drawWorld(time) {
        drawGround(time);

        for (const stone of stones) {
          const p = worldToScreen(stone.x, stone.y);
          const rock = ctx.createLinearGradient(p.x - stone.r, p.y - stone.r, p.x + stone.r, p.y + stone.r);
          rock.addColorStop(0, "#8b897d");
          rock.addColorStop(1, "#4e4b42");
          ctx.fillStyle = rock;
          ctx.beginPath();
          ctx.ellipse(p.x, p.y, stone.r * p.scale, stone.r * 0.48 * p.scale, 0.2, 0, Math.PI * 2);
          ctx.fill();
        }

        for (const leaf of leaves) drawLeaf(leaf);
        for (const drop of droplets) drawDrop(drop, time);

        const homeP = worldToScreen(home.x, home.y);
        ctx.fillStyle = "#070504";
        ctx.beginPath();
        ctx.ellipse(homeP.x, homeP.y, 74 * homeP.scale, 36 * homeP.scale, 0, 0, Math.PI * 2);
        ctx.fill();

        for (const food of foods) {
          if (food.got) continue;
          const p = worldToScreen(food.x, food.y);
          ctx.fillStyle = "#d9b45f";
          ctx.beginPath();
          ctx.arc(p.x, p.y + Math.sin(time * 0.004) * 4, 12 * p.scale, 0, Math.PI * 2);
          ctx.fill();
          ctx.strokeStyle = "rgba(255, 236, 156, 0.6)";
          ctx.stroke();
        }

        drawSpider();
        drawRealisticAnt(ant.x, ant.y, ant.angle);

        for (const blade of tallGrass) {
          const p = worldToScreen(blade.x, blade.y);
          if (p.x < -80 || p.x > window.innerWidth + 80 || p.y < -160 || p.y > window.innerHeight + 160) continue;
          const sway = Math.sin(time * 0.0012 + blade.sway) * 18;
          ctx.strokeStyle = `rgba(${Math.floor(blade.shade * 0.38)}, ${Math.floor(blade.shade)}, 48, ${0.58 + p.scale * 0.22})`;
          ctx.lineWidth = Math.max(2, blade.w * p.scale);
          ctx.beginPath();
          ctx.moveTo(p.x, p.y + 30 * p.scale);
          ctx.quadraticCurveTo(p.x + sway * p.scale, p.y - blade.h * 0.45 * p.scale, p.x + sway * 1.5 * p.scale, p.y - blade.h * p.scale);
          ctx.stroke();
        }

        const vignette = ctx.createRadialGradient(window.innerWidth / 2, window.innerHeight / 2, window.innerHeight * 0.1, window.innerWidth / 2, window.innerHeight / 2, window.innerHeight * 0.78);
        vignette.addColorStop(0, "rgba(0,0,0,0)");
        vignette.addColorStop(1, "rgba(0,0,0,0.44)");
        ctx.fillStyle = vignette;
        ctx.fillRect(0, 0, window.innerWidth, window.innerHeight);
      }

      function update(dt) {
        let mx = 0;
        let my = 0;
        if (keys.has("w") || keys.has("arrowup")) my -= 1;
        if (keys.has("s") || keys.has("arrowdown")) my += 1;
        if (keys.has("a") || keys.has("arrowleft")) mx -= 1;
        if (keys.has("d") || keys.has("arrowright")) mx += 1;

        const moving = mx || my;
        if (moving) {
          const len = Math.hypot(mx, my);
          mx /= len;
          my /= len;
          ant.x += mx * 230 * dt;
          ant.y += my * 230 * dt;
          ant.angle = Math.atan2(my, mx);
          ant.speed = 1;
          legTime += dt;
        } else {
          ant.speed = 0;
        }

        ant.x = Math.max(-820, Math.min(820, ant.x));
        ant.y = Math.max(-720, Math.min(760, ant.y));

        const dx = ant.x - spider.x;
        const dy = ant.y - spider.y;
        const dist = Math.hypot(dx, dy);
        if (dist < 650 && dist > 4) {
          spider.x += (dx / dist) * 84 * dt;
          spider.y += (dy / dist) * 84 * dt;
          spider.angle = Math.atan2(dy, dx);
        }
        if (dist < 62) {
          ant.life -= 26 * dt;
          if (ant.life <= 0) endGame("A aranha alcançou a formiga.");
        }

        for (const food of foods) {
          if (!food.got && Math.hypot(ant.x - food.x, ant.y - food.y) < 52) {
            food.got = true;
            foodCount += 1;
          }
        }

        if (foodCount >= 5) {
          objectiveText.textContent = "Volte ao formigueiro para completar a missão";
          if (Math.hypot(ant.x - home.x, ant.y - home.y) < 90) {
            endGame("Missao completa. A formiga voltou ao formigueiro com comida.");
          }
        }

        camera.x += (ant.x - camera.x) * 0.08;
        camera.y += (ant.y - 120 - camera.y) * 0.08;
        updateHud();
      }

      function updateHud() {
        lifeFill.style.width = `${Math.max(0, ant.life)}%`;
        foodText.textContent = `${foodCount}/5`;
      }

      function loop(time) {
        const dt = Math.min(0.033, (time - lastTime) / 1000);
        lastTime = time;
        if (running) update(dt);
        drawWorld(time);
        requestAnimationFrame(loop);
      }

      function startGame() {
        resetWorld();
        running = true;
        start.classList.add("hidden");
        gameOver.classList.add("hidden");
        objectiveText.textContent = "Colete 5 migalhas e evite a aranha";
      }

      function endGame(text) {
        running = false;
        gameOverText.textContent = text;
        gameOver.classList.remove("hidden");
      }

      window.addEventListener("resize", resize);
      window.addEventListener("keydown", (event) => keys.add(event.key.toLowerCase()));
      window.addEventListener("keyup", (event) => keys.delete(event.key.toLowerCase()));
      document.getElementById("startButton").addEventListener("click", startGame);
      document.getElementById("restartButton").addEventListener("click", startGame);

      resize();
      resetWorld();
      requestAnimationFrame(loop);
    </script>
  </body>
</html>
